{{- if .Values.observability.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "landppt.fullname" . }}
  labels:
    {{- include "landppt.labels" . | nindent 4 }}
    {{- with .Values.observability.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "landppt.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.observability.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.observability.serviceMonitor.scrapeTimeout }}
      authorization:
        type: Bearer
        credentials:
          name: {{ required "observability.serviceMonitor.bearerTokenSecret or app.existingSecret is required" (.Values.observability.serviceMonitor.bearerTokenSecret | default .Values.app.existingSecret) }}
          key: {{ required "observability.serviceMonitor.bearerTokenSecretKey is required" .Values.observability.serviceMonitor.bearerTokenSecretKey }}
{{- end }}
